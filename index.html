<style>
:root {
  color-scheme: light;
  --bg: #f3f1f0; --panel: #ffffff; --panel-2: #ebe8e7; --line: #d8d3d2; --fg: #1f1b1b; --muted: #655e5d;
  --brand: #E84039; --brand-ink: #ffffff; --brand-soft: #fde8e7; --sel: #2d7cff;
  --canvas: #d9d5d4; --bar-shape: #8a6df0; --bar-text: #2f9e8f; --bar-button: #E84039; --bar-image: #d98a1f; --bar-video: #d9622b; --bar-audio: #c2569c;
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #161314; --panel: #211d1e; --panel-2: #2b2627; --line: #3a3435; --fg: #f1eceb; --muted: #aaa09f;
  --brand-soft: #4a2220; --canvas: #0f0d0e; --sel: #5b9bff;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161314; --panel: #211d1e; --panel-2: #2b2627; --line: #3a3435; --fg: #f1eceb; --muted: #aaa09f;
  --brand-soft: #4a2220; --canvas: #0f0d0e; --sel: #5b9bff;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.4; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.app { --lcol: 0px; --rcol: 0px; display: grid; height: 100%; grid-template-columns: 30px var(--lcol) minmax(0, 1fr) var(--rcol) 30px; grid-template-rows: 46px auto minmax(0, 1fr) var(--th, 320px); grid-template-areas: "top top top top top" "ribbon ribbon ribbon ribbon ribbon" "ls slides canvas panel rs" "ls slides tl panel rs"; }
.app.dockl { --lcol: var(--lw, 250px); } .app.dockr { --rcol: var(--rw, 330px); }
.slides, .panel, .tl { position: relative; }
.slides.shut, .panel.shut { display: none; }
.slides.fly, .panel.fly { position: fixed; z-index: 35; top: var(--ptop, 120px); bottom: 0; box-shadow: 0 0 28px rgba(0,0,0,.35); } .slides.fly { left: 30px; width: var(--lw, 250px); } .panel.fly { right: 30px; width: var(--rw, 330px); }
.sidestrip { background: var(--panel); display: flex; flex-direction: column; gap: 6px; padding: 8px 3px; z-index: 36; } .sidestrip.ls { grid-area: ls; border-right: 1px solid var(--line); } .sidestrip.rs { grid-area: rs; border-left: 1px solid var(--line); }
.sbtn { writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); padding: 12px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer; } .sbtn:hover { color: var(--fg); background: var(--panel-2); } .sbtn.on { background: var(--brand-soft); color: var(--fg); border-color: var(--brand); }
.phead { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 12px; } .phead h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; } .phbtns { display: flex; gap: 4px; }
.rsec { display: none; flex: 1; min-height: 0; flex-direction: column; } .panel.s-props .rs-props, .panel.s-layers .rs-layers, .panel.s-fx .rs-fx { display: flex; } .rs-props .pbody { flex: 1; min-height: 0; overflow: auto; } .rs-layers .layers { flex: 1; max-height: none; border-top: 0; }
.rz { position: absolute; z-index: 6; background: transparent; } .rz:hover, .rz.on { background: var(--brand); opacity: .55; }
.rz.v { top: 0; bottom: 0; width: 6px; cursor: col-resize; } .rz.v.r { right: -3px; } .rz.v.l { left: -3px; } .rz.hz { left: 0; right: 0; height: 6px; top: -3px; cursor: row-resize; }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .logo { font-weight: 800; letter-spacing: .02em; color: var(--brand); white-space: nowrap; }
.top .title { width: 200px; min-width: 80px; font-weight: 600; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; }
.top .title:hover, .top .title:focus { border-color: var(--line); background: var(--bg); }
.sp { flex: 1; }
.toast { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.err { color: var(--brand); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 5px 10px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.icon { padding: 5px 7px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { padding: 3px 7px; font-size: 12px; }
.btn.danger:hover { border-color: var(--brand); color: var(--brand); }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu { position: relative; }
.menu .drop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu .drop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; }
.menu .drop button:hover { background: var(--panel-2); }

.slides { grid-area: slides; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.slides h2, .panel h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.slides .head { padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; }
.slides ol { list-style: none; margin: 0; padding: 4px 8px; overflow: auto; flex: 1; }
.slides li button { display: grid; grid-template-columns: 22px 1fr; gap: 6px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 7px 8px; }
.slides li button:hover { background: var(--panel-2); }
.slides li.on button { background: var(--brand-soft); border-color: var(--brand); }
.slides .n { color: var(--muted); font-weight: 700; }
.slides .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slides .du { color: var(--muted); font-size: 11px; grid-column: 2; }
.slides .foot { padding: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }

.center { grid-area: canvas; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tools { display: flex; align-items: stretch; gap: 0; }
.tools .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.ctxbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctxbar .tab { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px 7px 0 0; padding: 4px 10px; font-weight: 600; }
.ctxrow { display: flex; align-items: flex-end; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.ctxrow .ctxbar .tab { border-bottom: 0; display: inline-flex; align-items: center; gap: 4px; }
.fmt { display: flex; align-items: stretch; gap: 0; }
.fmt.off { opacity: .45; pointer-events: none; }
.fmt .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
.fmt select { width: 118px; padding: 3px 6px; }
.fmt input[type=number] { width: 58px; padding: 4px 6px; }
.fmt input[type=color] { width: 30px; height: 28px; padding: 1px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.fmt .btn.icon { min-width: 30px; justify-content: center; }
.fmt .btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.fmt svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
/* ---- Cinta de opciones ---- */
.ribbon { display: flex; grid-area: ribbon; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 20; }
.rtabs { display: flex; gap: 2px; padding: 4px 10px 0; align-items: flex-end; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.rtab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 18px; font-weight: 700; color: var(--muted); border-radius: 7px 7px 0 0; }
.rtab:hover { color: var(--fg); }
.rtab.on { background: var(--panel); border-color: var(--line); color: var(--brand); margin-bottom: -1px; padding-bottom: 7px; }
.rtab.file { background: var(--brand); color: var(--brand-ink); margin-right: 6px; border-radius: 6px 6px 0 0; }
.rtab.file:hover { filter: brightness(1.08); color: var(--brand-ink); }
.rtabs .menu .drop { left: 0; right: auto; min-width: 260px; padding: 6px; }
.rtabs .menu .drop button { display: flex; align-items: center; gap: 12px; padding: 9px 12px; font-weight: 600; }
.rtabs .menu .drop svg.ic { width: 22px; height: 22px; stroke: var(--brand); }
.rbody { display: flex; align-items: stretch; padding: 6px 8px 4px; min-height: 96px; overflow: hidden; }
.rpanes { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
.rpin { flex: none; display: flex; align-items: stretch; border-left: 2px solid var(--line); margin-left: 4px; padding-left: 4px; background: var(--panel); }
.rpin .rg:last-child { border-right: 0; }
.rtabs .sp { flex: 1; }
.themetog { position: relative; width: 30px; height: 100%; min-height: 66px; margin: 0; border-radius: 15px; border: 1px solid var(--line); background: var(--panel); padding: 0; flex: none; }
.themetog:hover { border-color: var(--muted); }
.themetog svg.ic { position: absolute; left: 6px; width: 16px; height: 16px; z-index: 2; stroke: var(--muted); transition: stroke .15s; }
.themetog .sun { top: calc(25% - 8px); } .themetog .moon { bottom: calc(25% - 8px); }
.themetog .knob { position: absolute; top: 2px; left: 2px; width: 24px; height: calc(50% - 2px); border-radius: 12px; background: var(--brand); z-index: 1; transition: transform .18s; }
.themetog[aria-checked=true] .knob { transform: translateY(100%); }
.themetog[aria-checked=false] .sun, .themetog[aria-checked=true] .moon { stroke: #fff; }
.prow { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 4px; }
.newpop .pib { display: inline-flex; align-items: center; gap: 6px; width: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 8px; font-size: 12px; font-weight: 600; }
.newpop .pib:hover { border-color: var(--muted); }
.newpop .pib.on { background: var(--brand-soft); border-color: var(--brand); }
.newpop .pib svg.ic { width: 18px; height: 18px; stroke: var(--brand); }
.pophead { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 2px; }
.pophead b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pophead button { border: 0; background: transparent; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 5px; }
.pophead button:hover { background: var(--panel-2); }
.newpop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.newpop button.pi[disabled] { opacity: .4; cursor: default; }
.scbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; }
.fb.hist { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.slides li .th { grid-column: 2; width: 156px; height: 88px; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: #fff; position: relative; pointer-events: none; margin: 2px 0; }
.slides li .th > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.slides li.on .th { border-color: var(--brand); }
.tlrow.ingroup .tlname { padding-left: 26px; }
.tlrow.tlgroup .tlname { font-weight: 700; }
.tlrow.tlgroup .tlname svg.ic { stroke: var(--muted); }
.gcar { border: 0; background: transparent; padding: 0 2px; color: var(--muted); font-size: 11px; width: 16px; }
.bar.gbar { background-color: var(--muted); opacity: .5; pointer-events: none; }
.selbox.sub { outline-width: calc(var(--u) * 2); outline-style: dashed; }
.guide { position: absolute; background: #ff2d95; pointer-events: none; z-index: 6; }
.guide.v { top: 0; bottom: 0; width: calc(var(--u) * 2); margin-left: calc(var(--u) * -1); }
.guide.h { left: 0; right: 0; height: calc(var(--u) * 2); margin-top: calc(var(--u) * -1); }
.marq { position: absolute; z-index: 6; pointer-events: none; border: calc(var(--u) * 2) dashed var(--sel); background: rgba(45,124,255,.12); }

.rpane { display: flex; align-items: stretch; gap: 0; min-width: min-content; }
.rg { display: flex; flex-direction: column; padding: 0 7px; border-right: 1px solid var(--line); }
.rg:last-child { border-right: 0; }
.rgb { display: flex; gap: 4px; align-items: stretch; flex: 1; }
.rgb.rgcol { flex-direction: column; justify-content: center; gap: 6px; }
.rgt { text-align: center; font-size: 11px; color: var(--muted); padding-top: 3px; white-space: nowrap; }
.rrow { display: flex; gap: 3px; align-items: center; }
.rb { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 5px 6px; min-width: 50px; font-size: 12px; font-weight: 600; line-height: 1.15; text-align: center; }
.rb:hover { background: var(--panel-2); border-color: var(--line); }
.rb.primary { background: var(--brand); color: var(--brand-ink); }
.rb.primary:hover { filter: brightness(1.07); background: var(--brand); border-color: var(--brand); }
.rb.primary svg.ic.big { stroke: var(--brand-ink); }
svg.ic.big { width: 30px; height: 30px; stroke: var(--brand); stroke-width: 1.6; }
.rcol { display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.rs { display: flex; align-items: center; gap: 7px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: 600; text-align: left; }
.rs:hover { background: var(--panel-2); border-color: var(--line); }
.rs svg.ic { stroke: var(--brand); }
.rsplit { display: flex; flex-direction: column; align-items: stretch; }
.rsplit .rcaret { white-space: nowrap; }
.rsplit .rb { padding-bottom: 2px; }
.rsplit .rcaret { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 1px 6px 3px; font-size: 12px; font-weight: 600; }
.rsplit .rcaret:hover { background: var(--panel-2); border-color: var(--line); }
.fmt .rgb { flex-direction: column; }
.newpop button.pi { display: flex; align-items: center; gap: 10px; }
.newpop button.pi svg.ic { stroke: var(--brand); width: 18px; height: 18px; }
.splitnew { display: flex; }
.splitnew .main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-size: 12.5px; background: var(--brand); color: var(--brand-ink); border: 1px solid var(--brand); border-radius: 8px 0 0 8px; padding: 8px 6px; font-weight: 700; }
.splitnew .caret { background: var(--brand); color: var(--brand-ink); border: 1px solid var(--brand); border-left: 1px solid rgba(255,255,255,.4); border-radius: 0 8px 8px 0; padding: 0 9px; }
.splitnew .main:hover, .splitnew .caret:hover { filter: brightness(1.08); }
.fbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.fb { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 2px 4px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
.fb:hover { color: var(--fg); border-color: var(--muted); }
.fb svg.ic { width: 18px; height: 18px; stroke: var(--brand); }
.fb.danger:hover { color: var(--brand); border-color: var(--brand); }
.fb[disabled] { opacity: .4; cursor: default; }
.slides li.over { box-shadow: inset 0 3px 0 var(--sel); }
.slides li.drag { opacity: .45; }
.ctxbar .tab.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.canvaswrap { flex: 1; min-height: 0; background: var(--canvas); position: relative; overflow: hidden; display: grid; place-items: center; }
.holder { position: relative; box-shadow: 0 6px 30px rgba(0,0,0,.25); }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; font-family: var(--font); color: #222; --u: 1px; user-select: none; touch-action: none; }
.stage .el { position: absolute; display: flex; line-height: 1.2; margin: 0; padding: 0; border: 0; white-space: pre-wrap; }
.stage .el ul, .stage .el ol { margin: 0; padding-left: 1.3em; }
.stage.editing .selbox i { display: none; }
.stage .el .tx { width: 100%; min-width: 0; }
.stage .qbox.cel { cursor: move; }
.stage .qbox .qprompt[data-edit], .stage .qbox .otx, .stage .qbox .qline { cursor: text; }
.stage .qbox .mark[data-mark] { cursor: pointer; }
.stage .qbox [contenteditable=true] { outline: calc(var(--u) * 3) dashed var(--sel); outline-offset: calc(var(--u) * 2); cursor: text; user-select: text; -webkit-user-select: text; min-width: 40px; }
.stage .qbox.qsel { outline: calc(var(--u) * 2) dashed var(--sel); }
.stage .tx[contenteditable=true] { cursor: text; -webkit-user-select: text; user-select: text; opacity: 1; outline: calc(var(--u) * 3) dashed var(--sel); outline-offset: calc(var(--u) * 2); }
.stage .el.center { align-items: center; justify-content: center; text-align: center; padding: 0 28px; }
.stage .el.cel { cursor: move; }
.stage .el.dim { opacity: .28; } .stage .el.ovf { outline: 1px dashed var(--brand); outline-offset: 2px; }
.stage .el .fill { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

; height: 18px; fill: currentColor; }\n.tool-btn, .vol-btn { flex: none; width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; color: var(--bar-fg); cursor: pointer; display: grid; place-items: center; }\n.tool-btn:hover, .vol-btn:hover { background: var(--bar-soft); }\n.tool-btn svg, .vol-btn svg { width: 22px; height: 22px; fill: currentColor; }\n\n/* Volumen: barra vertical que aparece sobre el altavoz y no mueve nada de la barra */\n.vol { position: relative; flex: none; }\n.vol-pop {\n  position: absolute; left: 50%; bottom: 100%; width: 40px; height: 128px; margin-left: -20px;\n  background: var(--bar-bg); border: 1px solid var(--bar-line); border-bottom: 0; border-radius: 10px 10px 0 0;\n  box-shadow: 0 -4px 16px rgba(0, 0, 0, .12);\n  opacity: 0; pointer-events: none; transition: opacity .15s ease;\n}\n.vol:hover .vol-pop, .vol:has(:focus-visible) .vol-pop { opacity: 1; pointer-events: auto; }\n.vol-pop input[type=\"range\"] { position: absolute; left: 50%; top: 50%; width: 92px; transform: translate(-50%, -50%) rotate(-90deg); }\n\n.track { position: relative; flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; }\n:is(.track, .vol-pop) input[type=\"range\"] {\n  -webkit-appearance: none; appearance: none; height: 8px; margin: 0; border-radius: 4px; cursor: pointer;\n  background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--bar-soft) var(--p, 0%));\n}\n.track input[type=\"range\"] { width: 100%; }\n:is(.track, .vol-pop) input[type=\"range\"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--bar-line); }\n:is(.track, .vol-pop) input[type=\"range\"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--bar-line); }\n.marks { position: absolute; lef  if (n in vars) return String(vars[n]); const q = sysVar(n); return q === undefined ? m : String(q); });\n  }\n  function compare(a, op, b) {\n    if (typeof b === 'number') a = Number(a);\n    else if (typeof b === 'boolean') a = (a === true || a === 'true');\n    switch (op) {\n      case '!=': return a != b;\n      case '>': return a > b;\n      case '<': return a < b;\n      case '>=': return a >= b;\n      case '<=': return a <= b;\n      case 'contains': return String(a).indexOf(String(b)) >= 0;\n      default: return a == b;\n    }\n  }\n  function setVar(name, value) {\n    vars[name] = coerce(name, value);\n    allEntries().forEach(paintEntry);\n    scorm.saveVars(vars);\n    const gen = generation;\n    ctxList().forEach((ctx) => ctx.triggers.forEach((item) => {\n      if (gen === generation && item.tr.event === 'variableChanges' && item.tr.variable === name) fire(item.tr, ctx, item.entry);\n    }));\n  }\n\n  /* ---------- Preguntas, puntuación y resultados ---------- */\n  const isGraded = (q) => !!q && q.graded !== false;\n  const ptsOf = (q) => (q.points == null ? 10 : Number(q.points) || 0);\n  // Una diapositiva de resultados puede contar solo algunas preguntas (results.scope === 'selected').\n  function quizScope() {\n    const cur = slides[state.index] && slides[state.index].slide;\n    return cur && cur.type === 'results' && cur.results && cur.results.scope === 'selected' ? new Set(cur.results.slides || []) : null;\n  }\n  function placeBox(box, holder) {\n    const b = holder && holder.box;\n    if (!b) return;\n    box.style.left = b.x + 'px'; box.style.top = b.y + 'px'; box.style.width = b.w + 'px'; box.style.height = b.h + 'px'; box.style.right = 'auto'; box.style.bottom = 'auto';\n  }\n  function quizStats(scope) {\n    if (scope === undefined) scope = quizScope();\n    let score = 0, max = 0, right = 0, total = 0;\n    slides.forEach(({ slide }) => {\n      const q = slide.question;\n      if (!isGraded(q)) return;\n      if (scope && !scope.has(slide.id)) return;\n      total++; max += ptsOf(q);\n      const r = quiz[slide.id];\n      if (r) { score += r.pts; if (r.ok) right++; }\n    });\n    const pct = max ? Math.round(score / max * 100) : 0;\n    const pass = course.quiz && course.quiz.passPct != null ? Number(course.quiz.passPct) : 80;\n    return { score, max, right, total, pct, pass, passed: pct >= pass };\n  }\n  function sysVar(n) {\n    if (n.slice(0, 4) !== 'quiz') return undefined;\n    const s = quizStats();\n    switch (n) {\n      case 'quizScore': return s.score; case 'quizMax': return s.max; case 'quizPct': return s.pct;\n      case 'quizPass': return s.pass; case 'quizRight': return s.right; case 'quizTotal': return s.total;\n      case 'quizResult': return s.passed ? 'Aprobado' : 'No aprobado';\n      default: return undefined;\n    }\n  }\n  function needsAnswer() {\n    const s = slides[state.index] && slides[state.index].slide, q = s && s.question;\n    if (!q || q.kind === undefined) return false;\n    const req = q.required !== undefined ? q.required : isGraded(q);\n    return !!req && !quiz[s.id];\n  }\n  function scoreChanged() {\n    allEntries().forEach(paintEntry);\n    scorm.saveVars(vars);\n  }\n  function fireEvent(ctx, name) {\n    const gen = generation;\n    (ctx.triggers || []).slice().forEach((item) => { if (gen === generation && item.tr.event === name) fire(item.tr, ctx, item.entry); });\n  }\n  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };\n  const normAns = (s, q) => {\n    s = String(s).trim().replace(/\\s+/g, ' ');\n    if (!q.caseSensitive) s = s.toLowerCase();\n    if (q.ignoreAccents) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');\n    return s;\n  };\n  function buildQuestion(slide) {\n    const q = slide.question, id = slide.id, kind = q.kind;\n    const graded = isGraded(q), opts = q.options || [];\n    const attempts = Math.max(1, Number(q.attempts) || 1);\n    const fb = q.feedback || {};\n    const box = mk('div', 'qbox');\n    placeBox(box, q);\n    box.append(mk('div', 'qprompt', interpolate(q.prompt || '')));\n    let tries = quiz[id] ? quiz[id].tries : 0;\n    let locked = !!quiz[id];\n    const sel = new Set();\n    let input = null;\n    const nodes = [];\n    const list = mk('div', 'qopts');\n    if (kind === 'text') {\n      input = mk('input', 'qtext');\n      input.type = 'text'; input.autocomplete = 'off'; input.spellcheck = false;\n      input.setAttribute('aria-label', 'Tu respuesta');\n      list.append(input);\n    } else {\n      list.setAttribute('role', kind === 'multi' ? 'group' : 'radiogroup');\n      const order = opts.map((_, i) => i);\n      (q.shuffle ? shuffled(order) : order).forEach((i) => {\n        const b = mk('button', 'qopt' + (kind === 'multi' ? ' multi' : ''));\n        b.type = 'button'; b.dataset.i = i;\n        b.setAttribute('role', kind === 'multi' ? 'checkbox' : 'radio'); b.setAttribute('aria-checked', 'false');\n        b.append(mk('span', 'mark'), mk('span', null, interpolate(opts[i].text || '')));\n        b.addEventListener('click', () => {\n          if (locked) return;\n          if (kind === 'multi') { sel.has(i) ? sel.delete(i) : sel.add(i); } else { sel.clear(); sel.add(i); }\n          paint(); fb2.textContent = '';\n        });\n        nodes.push(b); list.append(b);\n      });\n    }\n    box.append(list);\n    const foot = mk('div', 'qfoot');\n    const btn = mk('button', 'qbtn', graded ? 'Comprobar' : 'Enviar');\n    btn.type = 'button';\n    const fb2 = mk('div', 'qfb'); fb2.setAttribute('role', 'status');\n    foot.append(btn, fb2); box.append(foot);\n    const hasResp = () => (input ? input.value.trim() !== '' : sel.size > 0);\n    function paint() {\n      nodes.forEach((n) => { const on = sel.has(Number(n.dataset.i)); n.classList.toggle('sel', on); n.setAttribute('aria-checked', String(on)); });\n      btn.disabled = locked || !hasResp();\n    }\n    const isRight = () => {\n      if (kind === 'text') { const v = normAns(input.value, q); return (q.answers || []).some((a) => normAns(a, q) === v); }\n      const want = opts.map((o, i) => (o.correct ? i : -1)).filter((i) => i >= 0);\n      const got = [...sel].sort((a, b) => a - b);\n      return want.length === got.length && want.every((v, i) => v === got[i]);\n    };\n    function lock(ok, resp) {\n      locked = true;\n      nodes.forEach((n) => {\n        n.disabled = true;\n        const i = Number(n.dataset.i);\n        if (graded && q.feedback && q.feedback.showCorrect === false) return;\n        if (graded && opts[i].correct) n.classList.add('right');\n        else if (graded && sel.has(i)) n.classList.add('wrong');\n      });\n      if (input) { input.disabled = true; if (graded && !ok && fb.showCorrect !== false && (q.answers || [])[0]) fb2.dataset.answer = q.answers[0]; }\n      btn.hidden = true;\n    }\n    function show(text, good) { fb2.textContent = text; fb2.className = 'qfb ' + (good ? 'good' : 'bad'); }\n    btn.addEventListener('click', () => {\n      if (locked || !hasResp()) return;\n      tries++;\n      const ok = graded ? isRight() : true;\n      const resp = input ? input.value : [...sel];\n      if (graded && !ok && tries < attempts) {\n        show((fb.retry || 'No es correcta. Inténtalo de nuevo.') + ' (' + (attempts - tries) + (attempts - tries === 1 ? ' intento' : ' intentos') + ')', false);\n        if (input) { input.select(); } else sel.clear();\n        paint(); return;\n      }\n      quiz[id] = { ok, pts: graded && ok ? ptsOf(q) : 0, tries, resp };\n      lock(ok, resp);\n      if (!graded) show(fb.survey || 'Gracias por tu respuesta.', true);\n      else if (ok) show(fb.correct || '¡Correcto!', true);\n      else show((fb.incorrect || 'No es correcta.') + (fb2.dataset.answer ? ' Respuesta: ' + fb2.dataset.answer : ''), false);\n      scoreChanged();\n      fireEvent(base, graded ? (ok ? 'questionCorrect' : 'questionIncorrect')       app.append(h('div', { class: 'sidestrip ls' }, lbtn), h('div', { class: 'sidestrip rs' }, rbtns));
      const heads = (box, side) => {
        const pin = h('button', { class: 'btn small', type: 'button', onclick: () => { cfg[side].pin = !cfg[side].pin; save(); apply(); } }), x = h('button', { class: 'btn small', type: 'button', title: 'Plegar', onclick: () => { cfg[side].open = false; save(); apply(); } }, '✕');
        box.append(pin, x); return pin;
      };
      const lpin = heads($('#lBtns'), 'l'), rpin = heads($('#rBtns'), 'r');
      const apply = () => {
        ['lw', 'rw', 'th'].forEach((k) => { if (cfg[k]) app.style.setProperty('--' + k, cfg[k] + 'px'); });
        app.style.setProperty('--ptop', Math.round($('.center').getBoundingClientRect().top) + 'px');
        const lo = cfg.l.open, ro = cfg.r.open;
        app.classList.toggle('dockl', lo && cfg.l.pin); app.classList.toggle('dockr', ro && cfg.r.pin);
        lp.classList.toggle('shut', !lo); lp.classList.toggle('fly', lo && !cfg.l.pin);
        rp.classList.toggle('shut', !ro); rp.classList.toggle('fly', ro && !cfg.r.pin);
        rp.classList.remove('s-props', 's-layers', 's-fx'); rp.classList.add('s-' + cfg.r.sec); $('#rTitle').textContent = RT[cfg.r.sec];
        lbtn.classList.toggle('on', lo); rbtns.forEach((b) => b.classList.toggle('on', ro && b.dataset.sec === cfg.r.sec));
        [[lpin, cfg.l.pin], [rpin, cfg.r.pin]].forEach(([b, v]) => { b.textContent = v ? 'Soltar' : 'Fijar'; b.title = v ? 'Ahora ocupa sitio fijo; pulsa para que se superponga' : 'Ahora se superpone; pulsa para fijarlo y que ocupe sitio'; });
        if (ro && cfg.r.sec === 'fx') paintAnimPane();
        window.dispatchEvent(new Event('resize'));
      };
      const api = { r: (sec, open) => { const same = cfg.r.open && cfg.r.sec === sec; cfg.r.open = open == null ? !same : open; if (cfg.r.open) cfg.r.sec = sec; save(); apply(); } };
      panelApi = api;
      const grip = (host, cls, key, axis, min, max, sign) => {
        const g = h('div', { class: 'rz ' + cls });
        g.addEventListener('pointerdown', (ev) => {
          ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add('on');
          const p0 = axis === 'x' ? ev.clientX : ev.clientY, v0 = axis === 'x' ? (key === 'lw' ? lp.offsetWidth : rp.offsetWidth) : $('.tl').offsetHeight; let raf = 0;
          const mv = (e2) => { const d = ((axis === 'x' ? e2.clientX : e2.clientY) - p0) * sign; cfg[key] = Math.round(clamp(v0 + d, min, Math.min(max, (axis === 'x' ? window.innerWidth : window.innerHeight) * 0.6))); app.style.setProperty('--' + key, cfg[key] + 'px'); if (!raf) raf = requestAnimationFrame(() => { raf = 0; fit(); }); };
          const up = () => { g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.classList.remove('on'); save(); fit(); };
          g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
        });
        host.append(g);
      };
      grip(lp, 'v r', 'lw', 'x', 170, 520, 1); grip(rp, 'v l', 'rw', 'x', 240, 640, -1); grip($('.tl'), 'hz', 'th', 'y', 140, 700, -1);
      document.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Escape' || /^(input|textarea|select)$/i.test(ev.target.tagName || '')) return;
        let ch = false; if (cfg.r.open && !cfg.r.pin) { cfg.r.open = false; ch = true; } if (cfg.l.open && !cfg.l.pin) { cfg.l.open = false; ch = true; } if (ch) { save(); apply(); }
      });
      window.addEventListener('resize', () => { app.style.setProperty('--ptop', Math.round($('.center').getBoundingClientRect().top) + 'px'); });
      // Ancho de la columna de nombres de la línea de tiempo: se arrastra su borde derecho
      $('#tlinner').addEventListener('pointerdown', (ev) => {
        const nm = ev.target.closest && ev.target.closest('.tlname'); if (!nm || ev.button !== 0) return;
        const rr = nm.getBoundingClientRect(); if (ev.clientX < rr.right - 6) return;
        ev.preventDefault(); ev.stopPropagation();
        const x0 = ev.clientX, w0 = NAMEW; let raf = 0;
        const mv = (e2) => { NAMEW = Math.round(clamp(w0 + e2.clientX - x0, 120, 520)); document.documentElement.style.setProperty('--namew', NAMEW + 'px'); if (!raf) raf = requestAnimationFrame(() => { raf = 0; refreshTimeline(); }); };
        const up = () => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); try { localStorage.setItem('sua.namew', String(NAMEW)); } catch (e0) { /* sin almacenamiento */ } refreshTimeline(); };
        document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
      }, true);
      // Rueda sobre la línea de tiempo: zoom (centrado en el puntero) · Mayús: desplazar filas · Alt: grosor de las filas
      $('#tlscroll').addEventListener('wheel', (ev) => {
        const sc = $('#tlscroll'), r = sc.getBoundingClientRect(), dy = ev.deltaY;
        if (Math.abs(ev.deltaX) > Math.abs(dy)) return;
        if (ev.shiftKey && !ev.altKey) { ev.preventDefault(); sc.scrollTop += dy; return; }
        if (ev.altKey) { ev.preventDefault(); S.rowH = Math.round(clamp((S.rowH || 28) + (dy < 0 ? 4 : -4), 22, 90)); refreshTimeline(); return; }
        if (ev.clientX - r.left < NAMEW) return;
        ev.preventDefault();
        const px = ev.clientX - r.left, tA = (px + sc.scrollLeft - NAMEW) / S.pps;
        S.pps = clamp(S.pps * (ev.ctrlKey ? Math.exp(-dy * 0.01) : (dy < 0 ? 1.18 : 1 / 1.18)), 6, 600);
        refreshTimeline();
        const sc2 = $('#tlscroll'); sc2.scrollLeft = Math.max(0, NAMEW + tA * S.pps - px);
      }, { passive: false });
      apply();
    })();
    if (window.ResizeObserver) new ResizeObserver(() => { fit(); }).observe(wrap);
    window.addEventListener('resize', () => { fit(); });
  }

  async function boot() {
    try { const t = localStorage.getItem('editor.tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sin almacenamiento */ }
    await idb.open();
    (await idb.all()).forEach(([n, blob]) => { media[n] = { blob, url: URL.createObjectURL(blob) }; });
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('editor.curso') || 'null'); } catch (e) { /* sin datos */ }
    if (saved && saved.course && saved.course.scenes && saved.course.scenes[0] && saved.course.scenes[0].slides.length) { course = saved.course; S.sc = saved.sc || 0; S.si = saved.si || 0; }
    else course = newCourse();
    course.variables = course.variables || [];
    bind(); fitPps(); refreshAll(); paintModeSw();
    if (window.escritorio && escritorio.info) escritorio.info().then((i) => { $('.logo').title = 'Versión ' + i.version; if (i.actualizado) toast('Editor actualizado a la versión ' + i.version + '.'); }).catch(() => {});
    window.__editor = { get course() { return course; }, S, media, refreshAll };
  }
  boot();
})();
</script>
</body>
