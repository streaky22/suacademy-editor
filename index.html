<style>
:root {
  color-scheme: light;
  --bg: #f3f1f0; --panel: #ffffff; --panel-2: #ebe8e7; --line: #d8d3d2; --fg: #1f1b1b; --muted: #655e5d;
  --brand: #E84039; --brand-ink: #ffffff; --brand-soft: #fde8e7; --sel: #2d7cff;
  --canvas: #d9d5d4; --bar-shape: #8a6df0; --bar-text: #2f9e8f; --bar-button: #E84039; --bar-image: #d98a1f; --bar-video: #d9622b; --bar-audio: #c2569c;
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #161314; --panel: #211d1e; --panel-2: #2b2627; --line: #3a3435; --fg: #f1eceb; --muted: #aaa09f;
  --brand-soft: #4a2220; --canvas: #0f0d0e; --sel: #5b9bff;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #161314; --panel: #211d1e; --panel-2: #2b2627; --line: #3a3435; --fg: #f1eceb; --muted: #aaa09f;
  --brand-soft: #4a2220; --canvas: #0f0d0e; --sel: #5b9bff;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.4; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.app { --lcol: 0px; --rcol: 0px; display: grid; height: 100%; grid-template-columns: 30px var(--lcol) minmax(0, 1fr) var(--rcol) 30px; grid-template-rows: 46px auto minmax(0, 1fr) var(--th, 320px); grid-template-areas: "top top top top top" "ribbon ribbon ribbon ribbon ribbon" "ls slides canvas panel rs" "ls slides tl panel rs"; }
.app.dockl { --lcol: var(--lw, 250px); } .app.dockr { --rcol: var(--rw, 330px); }
.slides, .panel, .tl { position: relative; }
.slides.shut, .panel.shut { display: none; }
.slides.fly, .panel.fly { position: fixed; z-index: 35; top: var(--ptop, 120px); bottom: 0; box-shadow: 0 0 28px rgba(0,0,0,.35); } .slides.fly { left: 30px; width: var(--lw, 250px); } .panel.fly { right: 30px; width: var(--rw, 330px); }
.sidestrip { background: var(--panel); display: flex; flex-direction: column; gap: 6px; padding: 8px 3px; z-index: 36; } .sidestrip.ls { grid-area: ls; border-right: 1px solid var(--line); } .sidestrip.rs { grid-area: rs; border-left: 1px solid var(--line); }
.sbtn { writing-mode: vertical-rl; display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); padding: 12px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 700; cursor: pointer; } .sbtn:hover { color: var(--fg); background: var(--panel-2); } .sbtn.on { background: var(--brand-soft); color: var(--fg); border-color: var(--brand); }
.phead { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 12px; } .phead h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; } .phbtns { display: flex; gap: 4px; }
.rsec { display: none; flex: 1; min-height: 0; flex-direction: column; } .panel.s-props .rs-props, .panel.s-layers .rs-layers, .panel.s-fx .rs-fx { display: flex; } .rs-props .pbody { flex: 1; min-height: 0; overflow: auto; } .rs-layers .layers { flex: 1; max-height: none; border-top: 0; }
.rz { position: absolute; z-index: 6; background: transparent; } .rz:hover, .rz.on { background: var(--brand); opacity: .55; }
.rz.v { top: 0; bottom: 0; width: 6px; cursor: col-resize; } .rz.v.r { right: -3px; } .rz.v.l { left: -3px; } .rz.hz { left: 0; right: 0; height: 6px; top: -3px; cursor: row-resize; }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .logo { font-weight: 800; letter-spacing: .02em; color: var(--brand); white-space: nowrap; }
.top .title { width: 200px; min-width: 80px; font-weight: 600; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; }
.top .title:hover, .top .title:focus { border-color: var(--line); background: var(--bg); }
.sp { flex: 1; }
.toast { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.err { color: var(--brand); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 5px 10px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.icon { padding: 5px 7px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { padding: 3px 7px; font-size: 12px; }
.btn.danger:hover { border-color: var(--brand); color: var(--brand); }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu { position: relative; }
.menu .drop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu .drop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; }
.menu .drop button:hover { background: var(--panel-2); }

.slides { grid-area: slides; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.slides h2, .panel h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.slides .head { padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; }
.slides ol { list-style: none; margin: 0; padding: 4px 8px; overflow: auto; flex: 1; }
.slides li button { display: grid; grid-template-columns: 22px 1fr; gap: 6px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 7px 8px; }
.slides li button:hover { background: var(--panel-2); }
.slides li.on button { background: var(--brand-soft); border-color: var(--brand); }
.slides .n { color: var(--muted); font-weight: 700; }
.slides .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slides .du { color: var(--muted); font-size: 11px; grid-column: 2; }
.slides .foot { padding: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }

.center { grid-area: canvas; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tools { display: flex; align-items: stretch; gap: 0; }
.tools .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.ctxbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctxbar .tab { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px 7px 0 0; padding: 4px 10px; font-weight: 600; }
.ctxrow { display: flex; align-items: flex-end; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.ctxrow .ctxbar .tab { border-bottom: 0; display: inline-flex; align-items: center; gap: 4px; }
.fmt { display: flex; align-items: stretch; gap: 0; }
.fmt.off { opacity: .45; pointer-events: none; }
.fmt .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 3px; }
.fmt select { width: 118px; padding: 3px 6px; }
.fmt input[type=number] { width: 58px; padding: 4px 6px; }
.fmt input[type=color] { width: 30px; height: 28px; padding: 1px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.fmt .btn.icon { min-width: 30px; justify-content: center; }
.fmt .btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.fmt svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
/* ---- Cinta de opciones ---- */
.ribbon { display: flex; grid-area: ribbon; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 20; }
.rtabs { display: flex; gap: 2px; padding: 4px 10px 0; align-items: flex-end; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.rtab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 18px; font-weight: 700; color: var(--muted); border-radius: 7px 7px 0 0; }
.rtab:hover { color: var(--fg); }
.rtab.on { background: var(--panel); border-color: var(--line); color: var(--brand); margin-bottom: -1px; padding-bottom: 7px; }
.rtab.file { background: var(--brand); color: var(--brand-ink); margin-right: 6px; border-radius: 6px 6px 0 0; }
.rtab.file:hover { filter: brightness(1.08); color: var(--brand-ink); }
.rtabs .menu .drop { left: 0; right: auto; min-width: 260px; padding: 6px; }
.rtabs .menu .drop button { display: flex; align-items: center; gap: 12px; padding: 9px 12px; font-weight: 600; }
.rtabs .menu .drop svg.ic { width: 22px; height: 22px; stroke: var(--brand); }
.rbody { display: flex; align-items: stretch; padding: 6px 8px 4px; min-height: 96px; overflow: hidden; }
.rpanes { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
.rpin { flex: none; display: flex; align-items: stretch; border-left: 2px solid var(--line); margin-left: 4px; padding-left: 4px; background: var(--panel); }
.rpin .rg:last-child { border-right: 0; }
.rtabs .sp { flex: 1; }
.verbox { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; font-size: 12.5px; color: var(--muted); }
.verbox b { color: var(--fg); }
.atajos { border-collapse: collapse; width: 100%; font-size: 13.5px; } .atajos td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } .atajos kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font: inherit; font-weight: 700; white-space: nowrap; }
.themetog { position: relative; width: 30px; height: 100%; min-height: 66px; margin: 0; border-radius: 15px; border: 1px solid var(--line); background: var(--panel); padding: 0; flex: none; }
.themetog:hover { border-color: var(--muted); }
.themetog svg.ic { position: absolute; left: 6px; width: 16px; height: 16px; z-index: 2; stroke: var(--muted); transition: stroke .15s; }
.themetog .sun { top: calc(25% - 8px); } .themetog .moon { bottom: calc(25% - 8px); }
.themetog .knob { position: absolute; top: 2px; left: 2px; width: 24px; height: calc(50% - 2px); border-radius: 12px; background: var(--brand); z-index: 1; transition: transform .18s; }
.themetog[aria-checked=true] .knob { transform: translateY(100%); }
.themetog[aria-checked=false] .sun, .themetog[aria-checked=true] .moon { stroke: #fff; }
.prow { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 6px 4px; }
.newpop .pib { display: inline-flex; align-items: center; gap: 6px; width: auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 6px 8px; font-size: 12px; font-weight: 600; }
.newpop .pib:hover { border-color: var(--muted); }
.newpop .pib.on { background: var(--brand-soft); border-color: var(--brand); }
.newpop .pib svg.ic { width: 18px; height: 18px; stroke: var(--brand); }
.pophead { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 2px; }
.pophead b { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pophead button { border: 0; background: transparent; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 5px; }
.pophead button:hover { background: var(--panel-2); }
.newpop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.newpop button.pi[disabled] { opacity: .4; cursor: default; }
.scbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 100%; }
.fb.hist { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.slides li .th { grid-column: 2; width: 156px; height: 88px; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: #fff; position: relative; pointer-events: none; margin: 2px 0; }
.slides li .th > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.slides li.on .th { border-color: var(--brand); }
.tlrow.ingroup .tlname { padding-left: 26px; }
.tlrow.tlgroup .tlname { font-weight: 700; }
.tlrow.tlgroup .tlname svg.ic { stroke: var(--muted); }
.gcar { border: 0; background: transparent; padding: 0 2px; color: var(--muted); font-size: 11px; width: 16px; }
.bar.gbar { background-color: var(--muted); opacity: .5; pointer-events: none; }
.selbox.sub { outline-width: calc(var(--u) * 2); outline-style: dashed; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cardhead > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cardhead > button { flex: none; }
.sec.fold { padding: 0; margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
.sec.fold:last-child { border-bottom: 1px solid var(--line); }
.sec.fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 9px 10px; font-size: 12.5px; font-weight: 700; color: var(--fg); border-radius: 10px; }
.sec.fold > summary::-webkit-details-marker { display: none; }
.sec.fold > summary:hover { background: color-mix(in srgb, var(--brand) 8%, transparent); }
.sec.fold > summary:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.sec.fold > summary svg { width: 16px; height: 16px; color: var(--brand); flex: none; }
.sec.fold > summary::after { content: ''; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.sec.fold[open] > summary::after { transform: rotate(45deg); }
.sec.fold > :not(summary) { margin-left: 10px; margin-right: 10px; }
.sec.fold[open] { padding-bottom: 6px; }
.pbody .f.check { padding: 3px 0; }
.pbody .f.check input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; margin: 0; border: 0; padding: 0; }
.pbody .f.check input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.pbody .f.check input[type=checkbox]:checked { background: var(--brand); }
.pbody .f.check input[type=checkbox]:checked::after { transform: translateX(14px); }
.pbody .f.check input[type=checkbox]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.ccards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ccard { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; padding: 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); cursor: pointer; }
.ccard:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.ccard.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--bg)); }
.ccard .cpic { display: block; color: var(--muted); } .ccard.on .cpic { color: var(--brand); }
.ccard .cpic svg { width: 100%; height: 40px; display: block; }
.ccard b { font-size: 12.5px; } .ccard small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.bkrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
.bkrow > input[type=text] { flex: 1 1 160px; min-width: 120px; }
.bkpick { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.bkcount { font-size: 12px; color: var(--muted); }
.bkscroll { max-height: 42vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
.bktab { width: 100%; border-collapse: collapse; font-size: 13px; }
.bktab th { text-align: left; font-size: 11.5px; color: var(--muted); padding: 6px 8px; position: sticky; top: 0; background: var(--panel-2); }
.bktab td { padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.bktab select { width: 100%; min-width: 104px; }
.bkq { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bkq small { display: block; color: var(--muted); font-size: 11.5px; }
.bkq .th { flex: none; width: 112px; height: 63px; overflow: hidden; border: 1px solid var(--line); border-radius: 5px; background: #fff; position: relative; pointer-events: none; }
.bkq .th > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; zoom: .718; }
.dlg.pub:has(.bkwin), .dlg.pub:has(.imp), .dlg.pub:has(.formview) { width: min(900px, calc(100vw - 32px)); }
.bkwin { min-width: 0; }
.viewsw { display: grid; grid-template-columns: 1fr 1fr; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.viewsw button { border: 0; background: var(--panel-2); color: var(--muted); padding: 7px 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
.viewsw button.on { background: var(--brand); color: #fff; }
.viewsw button:not(.on):hover { color: var(--fg); }
.drawmock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; border: 6px dashed #9aa4ad; border-radius: 40px; background: #f4f6f8; color: #333; text-align: center; padding: 40px; box-sizing: border-box; }
.drawmock b { font-size: 64px; } .drawmock span { font-size: 38px; color: #666; }
.bkadd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.bkact { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bkact select { width: auto; max-width: 120px; }
