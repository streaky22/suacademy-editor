<style>
:root {
  color-scheme: light;
  --bg: #f3f1f0; --panel: #ffffff; --panel-2: #ebe8e7; --line: #d8d3d2; --fg: #1f1b1b; --muted: #655e5d;

  --canvas: #d9d5d4; --bar-shape: #8a6df0; --bar-text: #2f9e8f; --bar-button: #E84039; --bar-image: #d98a1f; --bar-video: #3b82d9; --bar-audio: #c2569c;
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --brand-soft: #4a2220; --canvas: #0f0d0e; --sel: #5b9bff;
} }
:root[data-theme="dark"] {
  color-scheme: dark;

}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.app { display: grid; height: 100%; grid-template-columns: 210px minmax(0, 1fr) 330px; grid-template-rows: 46px minmax(0, 1fr) 280px; grid-template-areas: "top top top" "slides canvas panel" "slides tl panel"; }
.top { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .logo { font-weight: 800; letter-spacing: .02em; color: var(--brand); white-space: nowrap; }

.sp { flex: 1; }
.toast { color: var(--muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.err { color: var(--brand); font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 5px 10px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.icon { padding: 5px 7px; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.small { padding: 3px 7px; font-size: 12px; }
.btn.danger:hover { border-color: var(--brand); color: var(--brand); }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu { position: relative; }
.menu .drop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu .drop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 5px; }
.menu .drop button:hover { background: var(--panel-2); }

.slides { grid-area: slides; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.slides h2, .panel h2 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.slides .head { padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; }
.slides ol { list-style: none; margin: 0; padding: 4px 8px; overflow: auto; flex: 1; }
.slides li button { display: grid; grid-template-columns: 22px 1fr; gap: 6px; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 7px; padding: 7px 8px; }
.slides li button:hover { background: var(--panel-2); }
.slides li.on button { background: var(--brand-soft); border-color: var(--brand); }
.slides .n { color: var(--muted); font-weight: 700; }
.slides .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slides .du { color: var(--muted); font-size: 11px; grid-column: 2; }
.slides .foot { padding: 8px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; }

.center { grid-area: canvas; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tools { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tools .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.ctxbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ctxbar .tab { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px 7px 0 0; padding: 4px 10px; font-weight: 600; }
.ctxrow { display: flex; align-items: flex-end; padding: 6px 10px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
.ctxrow .ctxbar .tab { border-bottom: 0; display: inline-flex; align-items: center; gap: 4px; }
.fmt { display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fmt.off { opacity: .45; pointer-events: none; }
.fmt .sepv { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.fmt select { width: 150px; padding: 4px 6px; }
.fmt input[type=number] { width: 58px; padding: 4px 6px; }
.fmt input[type=color] { width: 30px; height: 28px; padding: 1px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.fmt .btn.icon { min-width: 30px; justify-content: center; }
.fmt .btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.fmt svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.slides li.over { box-shadow: inset 0 3px 0 var(--sel); }
.slides li.drag { opacity: .45; }
.ctxbar .tab.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.canvaswrap { flex: 1; min-height: 0; background: var(--canvas); position: relative; overflow: hidden; display: grid; place-items: center; }
.holder { position: relative; box-shadow: 0 6px 30px rgba(0,0,0,.25); }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; font-family: var(--font); color: #222; --u: 1px; user-select: none; touch-action: none; }
.stage .el { position: absolute; display: flex; line-height: 1.2; margin: 0; padding: 0; border: 0; white-space: pre-wrap; }
.stage .el ul, .stage .el ol { margin: 0; padding-left: 1.3em; }
.stage.editing .selbox i { display: none; }
.stage .el .tx { width: 100%; min-width: 0; }
.stage .qbox.cel { cursor: move; }
.stage .qbox .qprompt[data-edit], .stage .qbox .otx, .stage .qbox .qline { cursor: text; }
.stage .qbox .mark[data-mark] { cursor: pointer; }
.stage .qbox [contenteditable=true] { outline: calc(var(--u) * 3) dashed var(--sel); outline-offset: calc(var(--u) * 2); cursor: text; user-select: text; -webkit-user-select: text; min-width: 40px; }
.stage .qbox.qsel { outline: calc(var(--u) * 2) dashed var(--sel); }
.stage .tx[contenteditable=true] { cursor: text; -webkit-user-select: text; user-select: text; opacity: 1; outline: calc(var(--u) * 3) dashed var(--sel); outline-offset: calc(var(--u) * 2); }
.stage .el.center { align-items: center; justify-content: center; text-align: center; padding: 0 28px; }
.stage .el.cel { cursor: move; }
.stage .el.dim { opacity: .28; }
.stage .el .fill { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage .ghost { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
.stage .dimmer { position: absolute; inset: 0; pointer-events: none; }
.stage .missing { position: absolute; inset: 0; display: grid; place-items: center; background: #cfcac9; color: #555; font-size: calc(14 * var(--u) * 1.6); text-align: center; pointer-events: none; }
.selbox { position: absolute; pointer-events: none; outline: calc(var(--u) * 3) solid var(--sel); }
.selbox i { position: absolute; width: calc(var(--u) * 16); height: calc(var(--u) * 16); background: #fff; border: calc(var(--u) * 3) solid var(--sel); pointer-events: auto; border-radius: calc(var(--u) * 3); }
.selbox i[data-h="nw"] { left: calc(var(--u) * -8); top: calc(var(--u) * -8); cursor: nwse-resize; }
.selbox i[data-h="n"] { left: calc(50% - var(--u) * 8); top: calc(var(--u) * -8); cursor: ns-resize; }
.selbox i[data-h="ne"] { right: calc(var(--u) * -8); top: calc(var(--u) * -8); cursor: nesw-resize; }
.selbox i[data-h="e"] { right: calc(var(--u) * -8); top: calc(50% - var(--u) * 8); cursor: ew-resize; }
.selbox i[data-h="se"] { right: calc(var(--u) * -8); bottom: calc(var(--u) * -8); cursor: nwse-resize; }
.selbox i[data-h="s"] { left: calc(50% - var(--u) * 8); bottom: calc(var(--u) * -8); cursor: ns-resize; }
.selbox i[data-h="sw"] { left: calc(var(--u) * -8); bottom: calc(var(--u) * -8); cursor: nesw-resize; }
.selbox i[data-h="w"] { left: calc(var(--u) * -8); top: calc(50% - var(--u) * 8); cursor: ew-resize; }
.shapepop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: repeat(6, 48px); gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100vw - 16px); }
.shapepop .shp { height: 44px; border: 1px solid transparent; background: transparent; border-radius: 7px; display: grid; place-items: center; }
.shapepop .shp:hover { background: var(--panel-2); border-color: var(--line); }
.shapepop .thumb { display: block; background: var(--brand); }
.layers li[draggable="true"] { cursor: grab; }
.layers li.over, .tlrow.over .tlname { box-shadow: inset 0 3px 0 var(--sel); }
.layers li.drag, .tlrow.drag { opacity: .45; }
.stage .qbox { position: absolute; left: 8%; right: 8%; top: 230px; bottom: 150px; overflow: auto; color: #222; display: flex; flex-direction: column; gap: 22px; pointer-events: auto; padding: 6px; }
.stage .qprompt { font-size: 50px; font-weight: 700; line-height: 1.25; }
.stage .qopts { display: flex; flex-direction: column; gap: 16px; }
.stage .qopt { display: flex; align-items: center; gap: 22px; text-align: left; font: inherit; font-size: 38px; font-weight: 500; color: #222; background: #F6F4F3; border: 4px solid #D8D3D2; border-radius: 16px; padding: 18px 26px; cursor: pointer; }
.stage .qopt:hover:not(:disabled) { border-color: #E84039; }
.stage .qopt .mark { flex: none; width: 38px; height: 38px; border: 4px solid #8d8584; border-radius: 50%; background: #fff; }
.stage .qopt.multi .mark { border-radius: 8px; }
.stage .qopt.sel { border-color: #E84039; background: #FDE8E7; }
.stage .qopt.sel .mark { background: #E84039; border-color: #E84039; box-shadow: inset 0 0 0 6px #fff; }
.stage .qopt.right { border-color: #2E7D32; background: #E6F4E7; }
.stage .qopt.right .mark { background: #2E7D32; border-color: #2E7D32; box-shadow: inset 0 0 0 6px #fff; }
.stage .qopt.wrong { border-color: #C62828; background: #FBE9E7; }
.stage .qopt:disabled { cursor: default; }
.stage .qtext { font: inherit; font-size: 40px; padding: 18px 26px; border: 4px solid #D8D3D2; border-radius: 16px; width: 100%; background: #fff; color: #222; }
.stage .qtext:disabled { background: #F6F4F3; }
.stage .qfoot { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.stage .qbtn { font: inherit; font-size: 34px; font-weight: 700; border: 0; border-radius: 14px; padding: 16px 40px; background: #E84039; color: #fff; cursor: pointer; }
.stage .qbtn:disabled { background: #C9C3C2; cursor: default; }
.stage .qfb { font-size: 34px; font-weight: 600; flex: 1; min-width: 0; }
.stage .qfb.good { color: #2E7D32; } .stage .qfb.bad { color: #C62828; }
.stage .qopt:focus-visible, .stage .qbtn:focus-visible, .stage .qtext:focus-visible { outline: 6px solid #222; outline-offset: 4px; }
.stage .qres { align-items: center; text-align: center; justify-content: center; }
.stage .qpct { font-size: 220px; font-weight: 800; line-height: 1; }
.stage .qpct.good { color: #2E7D32; } .stage .qpct.bad { color: #C62828; }
.stage .qline { font-size: 44px; font-weight: 600; }
.stage .qsub { font-size: 36px; color: #555; }
.optrow { display: grid; grid-template-columns: 22px 1fr 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
.optrow input[type=radio], .optrow input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; }
.newpop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 250px; max-height: 70vh; overflow: auto; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.newpop h4 { margin: 8px 8px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.newpop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; }
.newpop button:hover { background: var(--panel-2); }
.tagq { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); margin-right: 4px; }
.canvasinfo { position: absolute; left: 10px; bottom: 6px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--canvas) 80%, transparent); padding: 2px 6px; border-radius: 4px; pointer-events: none; }

.tl { grid-area: tl; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tlhead { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tlhead label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.tlhead input[type=number] { width: 64px; }
.tlscroll { flex: 1; overflow: auto; position: relative; min-height: 0; }
.tlinner { position: relative; min-width: 100%; }
.tlrow { display: flex; height: 28px; border-bottom: 1px solid var(--line); }
.tlrow.sel { background: var(--brand-soft); }
.tlname { position: sticky; left: 0; z-index: 3; width: 190px; flex: none; background: inherit; background-color: var(--panel); padding: 0 8px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--line); overflow: hidden; cursor: pointer; }
.tlrow.sel .tlname { background-color: var(--brand-soft); }
.tlname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tltrack { position: relative; flex: none; }
.tlrow.ruler { height: 24px; position: sticky; top: 0; z-index: 4; background: var(--panel); }
.tlrow.ruler .tltrack { cursor: col-resize; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding-left: 3px; pointer-events: none; }
.bar { position: absolute; top: 4px; height: 20px; border-radius: 5px; background: var(--bar-shape); min-width: 6px; cursor: grab; display: flex; align-items: center; overflow: hidden; color: #fff; font-size: 11px; font-weight: 600; padding: 0 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); touch-action: none; }
.bar.open { border-top-right-radius: 0; border-bottom-right-radius: 0; background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.12) 6px 12px); }
.bar.t-text { background-color: var(--bar-text); } .bar.t-button { background-color: var(--bar-button); } .bar.t-image { background-color: var(--bar-image); }
.bar.t-video { background-color: var(--bar-video); } .bar.t-audio { background-color: var(--bar-audio); } .bar.t-shape { background-color: var(--bar-shape); }
.bar .edge { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.bar .edge.l { left: 0; } .bar .edge.r { right: 0; }
.bar .an { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.3); pointer-events: none; }
.bar .lb { position: relative; pointer-events: none; white-space: nowrap; }
.bar.on { outline: 2px solid var(--sel); outline-offset: 1px; z-index: 2; }
.diamond { position: absolute; top: 8px; width: 11px; height: 11px; transform: translateX(-5px) rotate(45deg); background: #f2a900; border: 1px solid rgba(0,0,0,.35); cursor: pointer; padding: 0; }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--brand); z-index: 5; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; left: -7px; border: 6px solid transparent; border-top: 9px solid var(--brand); }

.panel { grid-area: panel; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 10px 4px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--brand); }
.layers { border-top: 1px solid var(--line); display: flex; flex-direction: column; max-height: 230px; min-height: 90px; background: var(--panel); }
.layers .lh { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 4px; }
.layers ul { list-style: none; margin: 0; padding: 2px 8px 8px; overflow: auto; }
.layers li { display: grid; grid-template-columns: 30px 1fr 30px; align-items: center; border: 1px solid transparent; border-radius: 7px; }
.layers li.on { background: var(--brand-soft); border-color: var(--brand); }
.layers li:hover { background: var(--panel-2); }
.layers li.on:hover { background: var(--brand-soft); }
.layers .lname { text-align: left; border: 0; background: transparent; padding: 7px 4px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layers .lbtn { border: 0; background: transparent; padding: 6px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.layers .lbtn:hover { color: var(--fg); background: var(--panel-2); }
.layers .lbtn.danger:hover { color: var(--brand); }
.layers .lbtn.off { opacity: .45; }
.pbody { overflow: auto; flex: 1; padding: 6px 12px 24px; min-height: 0; }
.sec { padding: 10px 0 6px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec > h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.row.one { grid-template-columns: 1fr; }
.row.three { grid-template-columns: 1fr 1fr 1fr; }
.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.f > span { font-size: 11px; color: var(--muted); font-weight: 600; }
.f.check { flex-direction: row; align-items: center; gap: 8px; }
.f.check > span { font-size: 12px; color: var(--fg); }
input[type=text], input[type=number], select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; min-width: 0; }
textarea { resize: vertical; min-height: 60px; }
input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); flex: none; }
.colorf { display: flex; gap: 6px; align-items: center; }
.colorf input[type=text] { flex: 1; }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 9px; margin-bottom: 10px; background: var(--bg); }
.card .cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.empty { color: var(--muted); padding: 14px 0; text-align: center; }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72); display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top, 0px)) 12px 12px; gap: 8px; }
.modal .mh { display: flex; gap: 8px; align-items: center; color: #fff; flex-wrap: wrap; }
.modal .mh b { margin-right: auto; }
.modal iframe { flex: 1; width: 100%; border: 0; border-radius: 8px; background: #000; min-height: 0; }

@media (max-width: 900px) {
  body { overflow: auto; height: auto; padding-inline: 16px; }
  .app { display: flex; flex-direction: column; height: auto; }
  .slides, .panel { max-height: 320px; border: 0; }
  .center { height: 70vh; }
  .tl { height: 240px; }
  .top { flex-wrap: wrap; padding: 6px 0; height: auto; }
}

rsor: pointer; display: flex; gap: 8px;\n}\n.slide-list button:hover { background: var(--panel-2); }\n.slide-list button[aria-current=\"true\"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }\n.slide-list .num { font-variant-numeric: tabular-nums; opacity: .75; }\n.trail { font-size: 14px; font-variant-numeric: tabular-nums; margin: 4px 0 0; overflow-wrap: anywhere; }\n.where { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin: 2px 0 0; }\ndetails { border: 1px solid var(--line); border-radius: 8px; min-width: 0; }\nsummary { cursor: pointer; padding: 9px 10px; font-weight: 600; font-size: 14px; border-radius: 8px; }\n.code { overflow-x: auto; border-top: 1px solid var(--line); }\npre { margin: 0; padding: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.5; }\n\n/* Barra inferior: flota sobre la diapositiva y se oculta sola cuando nadie la usa */\n.bar {\n  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;\n  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;\n  background: var(--bar-bg); color: var(--bar-fg);\n  border-top: 1px solid var(--bar-line); box-shadow: 0 -4px 16px rgba(0, 0, 0, .1);\n  padding-block: 10px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n  transition: opacity .25s ease, transform .25s ease;\n}\n.menu-btn { transition: opacity .25s ease; }\nbody.idle .bar { opacity: 0; transform: translateY(100%); pointer-events: none; }\nbody.idle .menu-btn { opacity: 0; pointer-events: none; }\nbody.idle .area { cursor: none; }\n.transport { display: flex; align-items: center; gap: 12px; flex: 1 1 320px; min-width: 0; }\n.icon-btn {\n  flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;\n  background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;\n}\n.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }\n     const list = owner.triggers;
    const P = { panel: true };
    const card = h('div', { class: 'card' });
    card.append(h('div', { class: 'cardhead' }, h('span', null, 'Accionador ' + (i + 1)), iconBtn('trash', 'Quitar', () => edit(() => { list.splice(i, 1); }, null, P), 'small danger')));
    card.append(selectField('Evento', isEl ? EVENTS_EL : (S.ctx === 'base' && slide().question ? EVENTS_CTX.concat(EVENTS_Q) : EVENTS_CTX), () => tr.event, (v) => { tr.event = v; if (v === 'timeReaches' && tr.time == null) tr.time = 1; }, P));
    if (tr.event === 'timeReaches') card.append(field('Segundo', 'number', () => tr.time, (v) => { tr.time = v == null ? 0 : v; }, { step: 0.1, min: 0, key: 'tt' + i }));
    if (tr.event === 'variableChanges') {
      const vo = varOptions();
      card.append(vo.length ? selectField('Variable', vo, () => tr.variable || (vo[0] && vo[0][0]), (v) => { tr.variable = v; }) : h('div', { class: 'hint' }, 'Crea primero una variable en la pestaña Variables.'));
      if (vo.length && !tr.variable) tr.variable = vo[0][0];
    }
    card.append(selectField('Acción', Object.keys(ACTIONS).map((k) => [k, ACTIONS[k]]), () => tr.action, (v) => {
      tr.action = v;
      ['target', 'variable', 'operation', 'value', 'state', 'url', 'code', 'result', 'points'].forEach((k) => { if (!(k === 'target' && /Layer|Timeline|Media|changeState|jumpToSlide/.test(v))) delete tr[k]; });
      if (v === 'jumpToSlide') tr.target = slides()[0].id;
      else if (v === 'showLayer') { tr.target = ((slide().layers || [])[0] || {}).id; }
      else if (v === 'hideLayer') tr.target = 'self';
      else if (v === 'changeState') { tr.target = 'self'; tr.state = 'disabled'; }
      else if (/Timeline$/.test(v)) tr.target = 'self';
      else if (/Media$/.test(v)) tr.target = (elOptions(owner, true)[0] || [])[0];
      else if (v === 'setVariable') { const vo = varOptions(); tr.variable = vo[0] && vo[0][0]; tr.operation = 'set'; tr.value = 0; }
      else if (v === 'openURL') tr.url = 'https://';
      else if (v === 'registerResult') tr.result = 'correct';
    }, P));
    const a = tr.action;
    if (a === 'jumpToSlide') card.append(selectField('Diapositiva', slides().map((s, k) => [s.id, (k + 1) + '. ' + (s.title || s.id)]), () => tr.target, (v) => { tr.target = v; }));
    if (a === 'showLayer' || a === 'hideLayer') {
      const lo = (slide().layers || []).map((l) => [l.id, l.title || l.id]);
      if (a === 'hideLayer') lo.unshift(['self', S.ctx !== 'base' ? 'Esta capa' : 'La capa donde está el objeto']);
      card.append(lo.length ? selectField('Capa', lo, () => tr.target, (v) => { tr.target = v; }) : h('div', { class: 'hint' }, 'Esta diapositiva no tiene capas. Crea una con «+ Capa».'));
    }
    if (a === 'pauseTimeline' || a === 'resumeTimeline') {
      const to = [['self', 'La capa o diapositiva de este objeto'], ['base', 'La diapositiva'], ['all', 'Todo']].concat((slide().layers || []).map((l) => [l.id, 'Capa: ' + (l.title || l.id)]));
      card.append(selectField('Qué línea de tiempo', to, () => tr.target, (v) => { tr.target = v; }));
    }
    if (a === 'changeState') {
      card.append(selectField('Objeto', elOptions(isEl ? owner : null, false), () => tr.target, (v) => { tr.target = v; }, P));
      const tgt = tr.target === 'self' || !tr.target ? (isEl ? owner : null) : [].concat(slide().elements || [], ...(slide().layers || []).map((l) => l.elements || [])).find((x) => x.id === tr.target);
      const names = ['normal', 'disabled'].concat(Object.keys((tgt && tgt.states) || {}), ['hover', 'down', 'visited']).filter((v, k, arr) => arr.indexOf(v) === k);
      card.append(selectField('Nuevo estado', names.map((n) => [n, n === 'normal' ? 'Normal' : n === 'disabled' ? 'Desactivado' : n]), () => tr.state || 'normal', (v) => { tr.state = v; }));
    }
    if (/Media$/.test(a)) {
      const mo = elOptions(isEl ? owner : null, true);
      card.append(mo.length ? selectField('Audio o vídeo', mo, () => tr.target, (v) => { tr.target = v; }) : h('div', { class: 'hint' }, 'No hay audio ni vídeo en esta diapositiva.'));
    }
    if (a === 'setVariable') {
      const vo = varOptions();
      if (!vo.length) card.append(h('div', { class: 'hint' }, 'Crea primero una variable en la pestaña Variables.'));
      else {
        card.append(selectField('Variable', vo, () => tr.variable, (v) => { tr.variable = v; tr.value = parseVal(v, ''); }, P));
        const d = (course.variables || []).find((v) => v.name === tr.variable);
        const ops = d && d.type === 'number' ? [['set', 'Poner'], ['add', 'Sumar'], ['subtract', 'Restar']] : d && d.type === 'boolean' ? [['set', 'Poner'], ['toggle', 'Invertir']] : [['set', 'Poner'], ['append', 'Añadir al final']];
        card.append(selectField('Operación', ops, () => tr.operation || 'set', (v) => { tr.operation = v; }, P));
        if (tr.operation !== 'toggle') card.append(valueField('Valor', tr.variable, () => tr.value, (v) => { tr.value = parseVal(tr.variable, v); }, 'tv' + i));
      }
    }
    if (a === 'registerResult') {
      card.append(selectField('Resultado', [['correct', 'Correcto'], ['incorrect', 'Incorrecto']], () => tr.result || 'correct', (v) => { tr.result = v; }));
      card.append(field('Puntos (vacío = los de la pregunta)', 'number', () => tr.points, (v) => { if (v == null) delete tr.points; else tr.points = v; }, { step: 1, min: 0, key: 'rpts' + i }));
    }
    if (a === 'openURL') {
      card.append(field('Dirección', 'text', () => tr.url, (v) => { tr.url = v || ''; }, { key: 'tu' + i, placeholder: 'https://…' }));
      card.append(checkField('Abrir en una ventana nueva', () => tr.newWindow !== false, (v) => { tr.newWindow = v; }));
    }
    if (a === 'runJS') card.append(textArea('Código (usa player.GetVar / player.SetVar)', () => tr.code, (v) => { tr.code = v; }, 'tj' + i));
    // condiciones
    const conds = tr.if || [];
    if (conds.length || (course.variables || []).length) {
      const box = h('div', { style: 'margin-top:6px' }, h('div', { class: 'hint', style: 'margin:0 0 4px' }, conds.length ? 'Solo si…' : ''));
      conds.forEach((c, k) => box.append(h('div', { class: 'row three', style: 'align-items:end' },
        selectField('', varOptions(), () => c.variable, (v) => { c.variable = v; }),
        selectField('', OPS, () => c.op || '==', (v) => { c.op = v; }),
        h('div', { style: 'display:flex;gap:4px' }, valueField('', c.variable, () => c.value, (v) => { c.value = parseVal(c.variable, v); }, 'tc' + i + k), iconBtn('trash', 'Quitar condición', () => edit(() => { conds.splice(k, 1); if (!conds.length) delete tr.if; }, null, P), 'small danger')))));
      if (varOptions().length) box.append(h('button', { class: 'btn small', onclick: () => edit(() => { tr.if = tr.if || []; tr.if.push({ variable: varOptions()[0][0], op: '==', value: parseVal(varOptions()[0][0], '') }); }, null, P) }, '+ Condición'));
      card.append(box);
    }
    return card;
  }

  /* ---------- Panel: variables ---------- */
  function renameVar(from, to) {
    (function walk(o) {
      if (Array.isArray(o)) o.forEach(walk);
      else if (o && typeof o === 'object') {
        Object.keys(o).forEach((k) => {
          if (k === 'variable' && o[k] === from) o[k] = to;
          else if (k === 'text' && typeof o[k] === 'string') o[k] = o[k].split('%' + from + '%').join('%' + to + '%');
          else walk(o[k]);
        });
      }
    })(course.scenes);
  }
  function varsPanel() {
    const vs = course.variables = course.variables || [];
    const out = [sec('Variables', h('div', { class: 'hint' }, 'Guardan datos del alumno (un contador, una respuesta, si ha visto algo). Muéstralas en cualquier texto escribiendo %nombre%. Se conservan en Moodle si vuelve al curso.'))];
    out.push(h('div', { class: 'hint' }, 'Variables del sistema, para usar en cualquier texto: %quizPct% (nota en %), %quizScore% y %quizMax% (puntos), %quizRight% y %quizTotal% (aciertos y preguntas), %quizResult% (Aprobado o No aprobado).'));
    if (!vs.length) out.push(h('div', { class: 'empty' }, 'No hay variables.'));
    vs.forEach((v, i) => {
      const nameInp = h('input', { type: 'text', value: v.name, 'aria-label': 'Nombre de la variable' });
      nameInp.addEventListener('change', () => {
        const nn = nameInp.value.trim();
        if (!/^[A-Za-z_]\w*$/.test(nn) || vs.some((x, k) => k !== i && x.name === nn)) { toast('Nombre no válido o repetido (solo letras, números y _).', true); nameInp.value = v.name; return; }
        edit(() => { renameVar(v.name, nn); v.name = nn; }, null, { full: true });
      });
      out.push(h('div', { class: 'card' },
        h('div', { class: 'cardhead' }, h('span', null, '%' + v.name + '%'), iconBtn('trash', 'Quitar', () => edit(() => { vs.splice(i, 1); }, null, { full: true }), 'small danger')),
        h('label', { class: 'f' }, h('span', null, 'Nombre'), nameInp),
        row(selectField('Tipo', [['number', 'Número'], ['text', 'Texto'], ['boolean', 'Verdadero / falso']], () => v.type, (t) => { v.type = t; v.value = t === 'number' ? 0 : t === 'boolean' ? false : ''; }, { full: true }),
          v.type === 'boolean' ? selectField('Valor inicial', [['true', 'Verdadero'], ['false', 'Falso']], () => String(!!v.value), (x) => { v.value = x === 'true'; })
            : field('Valor inicial', v.type === 'number' ? 'number' : 'text', () => v.value, (x) => { v.value = v.type === 'number' ? (x == null ? 0 : x) : (x == null ? '' : x); }, { key: 'vv' + i })),
        checkField('Recordar entre sesiones', () => v.persist !== false, (x) => { if (x) delete v.persist; else v.persist = false; })));
    });
    out.push(h('div', { class: 'sec' }, h('button', { class: 'btn', onclick: () => edit(() => { const t = new Set(vs.map((x) => x.name)); vs.push({ name: newId('variable', t), type: 'number', value: 0 }); }, null, { full: true }) }, ic('plus'), 'Añadir variable')));
    return out;
  }

  function renderPanel() {
    const tabs = $('#tabs'); tabs.textContent = '';
    [['props', 'Propiedades'], ['trig', 'Accionadores'], ['vars', 'Variables']].forEach((t) => tabs.append(h('button', { class: S.tab === t[0] ? 'on' : '', onclick: () => { S.tab = t[0]; renderPanel(); } }, t[1])));
    const b = $('#pbody'), keep = b.scrollTop;
    b.textContent = '';
    const e = selEl();
    if (S.tab === 'props') b.append(...(e && e.type !== 'qbox' ? elementProps(e) : contextProps()));
    else if (S.tab === 'trig') b.append(...triggersPanel());
    else b.append(...varsPanel());
    b.scrollTop = keep;
  }

  function refreshAll() {
    fixState();
    $('#courseTitle').value = course.title;
    refreshSlides(); paintSlideFoot(); paintTools(); refreshCanvas(); refreshTimeline(); renderPanel(); paintUndo();
  }

  /* ---------- Vista previa y exportación ---------- */
  function playerParts() {
    const src = PLAYER;
    const cut = src.indexOf('<div class="area"');
    return { head: src.slice(0, cut), body: src.slice(cut) };
  }
  function withCourse(src, c) {
    const json = JSON.stringify(c).replace(/</g, '\\u003c');
    return src.replace(/(<script type="application\/json" id="curso">)[\s\S]*?(<\/script>)/, (m, a, b) => a + '\n' + json + '\n' + b);
  }
  function pageHtml(c, extraHead) {
    const full = withCourse(PLAYER, c);
    const cut = full.indexOf('<div class="area"');
    return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      (extraHead || '') + full.slice(0, cut) + '</head>\n<body>\n' + full.slice(cut) + '</body>\n</html>\n';
  }
  function checkMedia() {
    const missing = [...usedSrcs(course)].filter((s) => !media[mediaName(s)]);
    return missing;
  }
  function openPreview(here) {
    const c = JSON.parse(JSON.stringify(course));
    (function walk(o) {
      if (Array.isArray(o)) o.forEach(walk);
      else if (o && typeof o === 'object') { if (typeof o.src === 'string' && o.src) o.src = mediaUrl(o.src) || o.src; Object.keys(o).forEach((k) => walk(o[k])); }
    })(c);
    const startAt = here ? '<script>window.__startAt=' + JSON.stringify(slide().id) + ';<\/script>\n' : '';
    $('#pvFrame').srcdoc = pageHtml(c, startAt);
    $('#pv').hidden = false;
    $('#pvClose').focus();
  }
  function slug(s) { return (String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) || 'curso'; }
  const xml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function manifest(title, files, id) {
    return '<?xml version="1.0" encoding="UTF-8"?>\n<manifest identifier="CURSO-' + xml(id) + '" version="1.0"\n  xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"\n  xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"\n  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n  <metadata>\n    <schema>ADL SCORM</schema>\n    <schemaversion>1.2</schemaversion>\n  </metadata>\n  <organizations default="ORG-1">\n    <organization identifier="ORG-1">\n      <title>' + xml(title) + '</title>\n      <item identifier="ITEM-1" identifierref="RES-1" isvisible="true">\n        <title>' + xml(title) + '</title>\n      </item>\n    </organization>\n  </organizations>\n  <resources>\n    <resource identifier="RES-1" type="webcontent" adlcp:scormtype="sco" href="index.html">\n' +
      files.map((f) => '      <file href="' + xml(f) + '"/>').join('\n') + '\n    </resource>\n  </resources>\n</manifest>\n';
  }
  async function buildScorm() {
    if (!window.JSZip) throw new Error('No se ha podido cargar la librería de zip.');
    const used = [...usedSrcs(course)];
    const zip = new JSZip();
    zip.file('imsmanifest.xml', manifest(course.title, ['index.html'].concat(used), slug(course.title)));
    zip.file('index.html', pageHtml(course));
    used.forEach((s) => zip.file(s, media[mediaName(s)].blob));
    return zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  }
  async function saveFile(filename, blob) {
    if (window.escritorio) {          // aplicación de escritorio: cuadro de diálogo de guardar del sistema
      try {
        const r = await escritorio.guardar(filename, await blob.arrayBuffer());
        if (r.cancelado) { toast('Guardado cancelado.'); return false; }
        toast('Guardado en ' + r.ruta); return true;
      } catch (err) { toast('No se pudo guardar: ' + (err.message || err), true); return false; }
    }
    const dl = window.claude && claude.use ? await claude.use('downloads') : null;
    if (!dl) { toast('Esta vista no permite descargar archivos. Abre el editor desde claude.ai.', true); return false; }
    try { await dl.save({ filename, data: blob }); toast('Guardado: ' + filename); return true; }
    catch (err) { if (err && err.code === 'declined') toast('Descarga cancelada.'); else toast('No se pudo guardar (' + ((err && (err.code || err.message)) || 'error') + ').', true); return false; }
  }
  async function exportScorm() {
    const missing = checkMedia();
    if (missing.length) { toast('Faltan archivos: ' + missing.map(mediaName).join(', ') + '. Súbelos de nuevo en el objeto.', true); return; }
    toast('Preparando el SCORM…');
    try { await saveFile(slug(course.title) + '-scorm12.zip', await buildScorm()); } catch (err) { toast(err.message, true); }
  }
  async function saveProject() {
    if (!window.JSZip) { toast('No se ha podido cargar la librería de zip.', true); return; }
    const zip = new JSZip();
    zip.file('proyecto.json', JSON.stringify(course, null, 1));
    [...usedSrcs(course)].forEach((s) => { const m = media[mediaName(s)]; if (m) zip.file(s, m.blob); });
    await saveFile(slug(course.title) + '-proyecto.zip', await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }));
  }
  async function openProject(file) {
    try {
      let c = null;
      if (/\.json$/i.test(file.name)) c = JSON.parse(await file.text());
      else {
        const zip = await JSZip.loadAsync(file);
        let f = zip.file('proyecto.json');
        if (f) c = JSON.parse(await f.async('string'));
        else {
          f = zip.file('index.html');            // un SCORM exportado por este editor también se puede abrir
          const m = f && (await f.async('string')).match(/<script type="application\/json" id="curso">([\s\S]*?)<\/script>/);
          if (!m) throw new Error('El zip no es un proyecto de este editor.');
          c = JSON.parse(m[1]);
        }
        const files = Object.keys(zip.files).filter((n) => /^media\//.test(n) && !zip.files[n].dir);
        for (const n of files) { const blob = await zip.file(n).async('blob'); const nm = n.slice(6); if (!media[nm]) { media[nm] = { blob, url: URL.createObjectURL(blob) }; idb.put(nm, blob); } }
      }
      if (!c || !c.scenes || !c.scenes[0] || !c.scenes[0].slides) throw new Error('El archivo no tiene un curso válido.');
      snap(null); course = c; course.variables = course.variables || []; S.si = 0; S.ctx = 'base'; S.sel = null; S.t = 0; fitPps(); refreshAll(); dirty();
      toast('Proyecto abierto: ' + course.title);
    } catch (err) { toast(err.message || 'No se pudo abrir el archivo.', true); }
  }
  function loadExample() {
    const m = PLAYER.match(/<script type="application\/json" id="curso">([\s\S]*?)<\/script>/);
    const c = JSON.parse(m[1]);
    c.title = 'Ejemplo con capas';
    c.scenes[0].slides = c.scenes[0].slides.filter((s) => !s.elements.some((e) => e.src));
    snap(null); course = c; S.si = c.scenes[0].slides.length - 1; S.ctx = 'base'; S.sel = null; S.t = 0; fitPps(); refreshAll(); dirty();
    toast('Ejemplo cargado (sin audio ni vídeo).');
  }

  /* ---------- Arranque ---------- */
  function bind() {
    $('#undoBtn').append(ic('undo')); $('#redoBtn').append(ic('redo'));
    $('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
    $('#previewBtn').append(ic('play'), 'Vista previa');
    $('#previewBtn').addEventListener('click', () => openPreview(true));
    $('#pvHere').addEventListener('click', () => openPreview(true));
    $('#pvStart').addEventListener('click', () => openPreview(false));
    $('#pvClose').addEventListener('click', () => { $('#pv').hidden = true; $('#pvFrame').srcdoc = ''; });
    $('#exportBtn').addEventListener('click', exportScorm);
    $('#courseTitle').addEventListener('input', (ev) => { edit(() => { course.title = ev.target.value; }, 'title'); });
    const drop = $('#projDrop');
    $('#projBtn').addEventListener('click', (ev) => { ev.stopPropagation(); drop.hidden = !drop.hidden; });
    document.addEventListener('click', () => { drop.hidden = true; closeShapes(); });
    drop.addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      const p = b.dataset.p;
      if (p === 'new') { snap(null); course = newCourse(); S.si = 0; S.ctx = 'base'; S.sel = null; S.t = 0; fitPps(); refreshAll(); dirty(); }
      else if (p === 'open') { const f = $('#openFile'); f.value = ''; f.onchange = () => f.files[0] && openProject(f.files[0]); f.click(); }
      else if (p === 'save') saveProject();
      else if (p === 'example') loadExample();
      else if (p === 'theme') {
        const root = document.documentElement;
        const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        try { localStorage.setItem('editor.tema', root.dataset.theme); } catch (e) { /* sin almacenamiento */ }
      }
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeShapes();
      if (!$('#pv').hidden) { if (ev.key === 'Escape') $('#pvClose').click(); return; }
      const tag = (ev.target.tagName || '').toLowerCase();
      const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || ev.target.isContentEditable;
      const mod = ev.ctrlKey || ev.metaKey;
      if (mod && !typing && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
      if (mod && !typing && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
      if (typing) return;
      const e = selEl(), er = selReal();
      if (mod && ev.key.toLowerCase() === 'd' && er) { ev.preventDefault(); duplicateSel(); }
      else if (mod && ev.key.toLowerCase() === 'c' && er) { clip = JSON.stringify(er); }
      else if (mod && ev.key.toLowerCase() === 'v' && clip) {
        const c = JSON.parse(clip); c.id = newId('el', allIds()); if (c.x != null) { c.x += 40; c.y += 40; }
        edit(() => { elements().push(c); S.sel = c.id; }, null, { full: true });
      }
      else if ((ev.key === 'Delete' || ev.key === 'Backspace') && er) { ev.preventDefault(); deleteSel(); }
      else if (ev.key === 'Escape' && S.sel) select(null);
      else if (e && e.x != null && /^Arrow/.test(ev.key)) {
        ev.preventDefault();
        const st = ev.shiftKey ? 10 : 1;
        edit(() => { if (ev.key === 'ArrowLeft') e.x -= st; if (ev.key === 'ArrowRight') e.x += st; if (ev.key === 'ArrowUp') e.y -= st; if (ev.key === 'ArrowDown') e.y += st; }, 'nudge' + e.id);
        liveGeom(e);
      }
    });
    if (window.ResizeObserver) new ResizeObserver(() => { fit(); }).observe(wrap);
    window.addEventListener('resize', () => { fit(); });
  }

  async function boot() {
    try { const t = localStorage.getItem('editor.tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* sin almacenamiento */ }
    await idb.open();
    (await idb.all()).forEach(([n, blob]) => { media[n] = { blob, url: URL.createObjectURL(blob) }; });
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('editor.curso') || 'null'); } catch (e) { /* sin datos */ }
    if (saved && saved.course && saved.course.scenes && saved.course.scenes[0] && saved.course.scenes[0].slides.length) { course = saved.course; S.si = saved.si || 0; }
    else course = newCourse();
    course.variables = course.variables || [];
    bind(); fitPps(); refreshAll();
    if (window.escritorio && escritorio.info) escritorio.info().then((i) => { $('.logo').title = 'Versión ' + i.version; if (i.actualizado) toast('Editor actualizado a la versión ' + i.version + '.'); }).catch(() => {});
    window.__editor = { get course() { return course; }, S, media };
  }
  boot();
})();
</script>
